<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Шашки Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.5);
            --text: #f8fafc;
            --board-light: #e2e8f0;
            --board-dark: #334155;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.96);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .start-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            cursor: pointer;
        }

        .tab-content {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        .quick-settings {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-title { font-size: 12px; font-weight: 700; color: #94a3b8; }

        .selector-group {
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 2px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .pill-btn {
            padding: 4px 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .pill-btn.active {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .eval-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 10px;
        }

        .eval-best { font-size: 15px; color: var(--green); font-weight: 800; }

        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(15, 23, 42, 0.9);
            padding: 6px;
            border-radius: 18px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .board-wrapper.turn-top {
            border-top-color: var(--accent);
            box-shadow: 0 -6px 16px rgba(59, 130, 246, 0.3);
        }
        .board-wrapper.turn-bottom {
            border-bottom-color: var(--accent);
            box-shadow: 0 6px 16px rgba(59, 130, 246, 0.3);
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            border-radius: 10px;
            overflow: hidden;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .cell.light { background-color: var(--board-light); }
        .cell.dark { background-color: var(--board-dark); }
        .cell.selected { background-color: #2563eb !important; }

        .cell.valid-move::after {
            content: '';
            width: 30%;
            height: 30%;
            background: rgba(16, 185, 129, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green-glow);
        }

        .cell.best-from-player { background-color: #047857 !important; animation: pulse-green 1.2s infinite alternate; }
        .cell.best-to-player { background-color: #10b981 !important; animation: pulse-green 1.2s infinite alternate; }

        @keyframes pulse-green {
            0% { box-shadow: inset 0 0 4px var(--green-glow); }
            100% { box-shadow: inset 0 0 14px var(--green); }
        }

        .piece {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease-out, opacity 0.15s ease-out;
        }

        .piece.white {
            background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }

        .piece.black {
            background: radial-gradient(circle at 35% 35%, #334155, #0f172a);
            border: 2px solid #020617;
            box-shadow: 0 3px 6px rgba(0,0,0,0.6);
        }

        .piece.king::after { content: '👑'; font-size: 14px; }

        .controls-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: var(--card-bg);
            text-align: center;
        }

        .settings-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            width: 50%;
        }

        .nav-item.active { color: var(--accent); }
        .nav-icon { font-size: 18px; }
    </style>
</head>
<body>

    <div class="start-overlay" id="start-overlay">
        <h2 style="margin-bottom: 8px;">🎯 Шашки Pro</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 20px;">Нажмите для запуска игры</p>
        <button class="start-btn" onclick="startApp()">Войти в приложение 🚀</button>
    </div>

    <div class="tab-content active" id="tab-game">
        <div class="quick-settings">
            <div class="setting-row">
                <span class="setting-title">Размер:</span>
                <div class="selector-group">
                    <button class="pill-btn" id="size-6" onclick="changeBoardSize(6)">6x6</button>
                    <button class="pill-btn active" id="size-8" onclick="changeBoardSize(8)">8x8</button>
                    <button class="pill-btn" id="size-10" onclick="changeBoardSize(10)">10x10</button>
                </div>
            </div>
            <div class="setting-row">
                <span class="setting-title">Играю за:</span>
                <div class="selector-group">
                    <button class="pill-btn active" id="side-w" onclick="setPlayerSide('W')">⚪️ Белых</button>
                    <button class="pill-btn" id="side-b" onclick="setPlayerSide('B')">⚫️ Чёрных</button>
                </div>
            </div>
        </div>

        <div class="eval-card">
            <div class="eval-best" id="best-move-text">Расчёт...</div>
        </div>

        <div class="board-wrapper" id="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="controls-grid">
            <button class="btn-action" onclick="undoMove()">↩️ Назад</button>
            <button class="btn-action" style="color: #fca5a5;" onclick="resetBoard()">🔄 Сброс</button>
        </div>
    </div>

    <div class="tab-content" id="tab-settings">
        <div class="settings-card">
            <h3 style="margin: 0 0 6px 0; font-size: 15px;">⚙️ Звуковые настройки</h3>
            
            <div class="setting-row">
                <span class="setting-title">Фоновая музыка:</span>
                <button class="pill-btn active" id="toggle-music" onclick="toggleMusic()">🎵 ВКЛ</button>
            </div>

            <div class="setting-row">
                <span class="setting-title">Следующий трек:</span>
                <button class="pill-btn" onclick="nextTrack(true)">⏭ Пропустить</button>
            </div>

            <div class="setting-row">
                <span class="setting-title">Звуковые эффекты:</span>
                <button class="pill-btn active" id="toggle-sfx" onclick="toggleSFX()">🔊 ВКЛ</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" id="nav-game" onclick="switchTab('game')">
            <span class="nav-icon">🎮</span>
            <span>Доска</span>
        </div>
        <div class="nav-item" id="nav-settings" onclick="switchTab('settings')">
            <span class="nav-icon">⚙️</span>
            <span>Аудио</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const playlist = [
            "2_5235792221629884133.mp3",
            "2_5246842657086400740.mp3",
            "2_5298507548834436762.mp3",
            "2_5299002548110272662.mp3",
            "6508223425_2349259877.m4a"
        ];

        let playQueue = [];
        let audioPlayer = new Audio();
        let isMusicOn = true;
        let isSFXOn = true;
        const TARGET_VOLUME = 0.12;

        let fadeInterval = null;
        let isTransitioning = false;

        function generateShuffleQueue() {
            let indices = playlist.map((_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            return indices;
        }

        function getNextTrackIndex() {
            if (playQueue.length === 0) {
                playQueue = generateShuffleQueue();
            }
            return playQueue.shift();
        }

        function startApp() {
            document.getElementById('start-overlay').style.display = 'none';
            playNextTrack();
        }

        function playNextTrack() {
            if (!isMusicOn) return;
            const nextIdx = getNextTrackIndex();

            if (audioPlayer.src && !audioPlayer.paused) {
                smoothTransitionTo(playlist[nextIdx]);
            } else {
                startTrackWithFadeIn(playlist[nextIdx]);
            }
        }

        function smoothTransitionTo(trackSrc) {
            if (isTransitioning) return;
            isTransitioning = true;
            clearInterval(fadeInterval);

            let vol = audioPlayer.volume;
            fadeInterval = setInterval(() => {
                vol -= 0.015;
                if (vol <= 0) {
                    clearInterval(fadeInterval);
                    audioPlayer.pause();
                    audioPlayer.volume = 0;
                    isTransitioning = false;
                    startTrackWithFadeIn(trackSrc);
                } else {
                    audioPlayer.volume = vol;
                }
            }, 30);
        }

        function startTrackWithFadeIn(trackSrc) {
            clearInterval(fadeInterval);
            audioPlayer.src = trackSrc;
            audioPlayer.volume = 0;

            let playPromise = audioPlayer.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    let vol = 0;
                    fadeInterval = setInterval(() => {
                        vol += 0.01;
                        if (vol >= TARGET_VOLUME) {
                            audioPlayer.volume = TARGET_VOLUME;
                            clearInterval(fadeInterval);
                        } else {
                            audioPlayer.volume = vol;
                        }
                    }, 40);
                }).catch(() => {
                    setTimeout(() => playNextTrack(), 500);
                });
            }
        }

        function nextTrack(manual = false) {
            if (manual && !isMusicOn) return;
            playNextTrack();
        }

        audioPlayer.addEventListener('ended', () => {
            playNextTrack();
        });

        audioPlayer.addEventListener('error', () => {
            if (isMusicOn) setTimeout(() => playNextTrack(), 500);
        });

        function toggleMusic() {
            isMusicOn = !isMusicOn;
            const btn = document.getElementById('toggle-music');
            if (isMusicOn) {
                btn.classList.add('active');
                btn.innerText = "🎵 ВКЛ";
                playNextTrack();
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔇 ВЫКЛ";
                clearInterval(fadeInterval);
                audioPlayer.pause();
            }
        }

        function toggleSFX() {
            isSFXOn = !isSFXOn;
            const btn = document.getElementById('toggle-sfx');
            btn.classList.toggle('active', isSFXOn);
            btn.innerText = isSFXOn ? "🔊 ВКЛ" : "🔇 ВЫКЛ";
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!isSFXOn) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'move') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'capture') {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.12);
                }
            } catch (e) {}
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tab === 'game') {
                document.getElementById('tab-game').classList.add('active');
                document.getElementById('nav-game').classList.add('active');
            } else {
                document.getElementById('tab-settings').classList.add('active');
                document.getElementById('nav-settings').classList.add('active');
            }
        }
                      /* ---------------- ОБНОВЛЕННЫЙ ДВИЖОК ШАШЕК И АЛГОРИТМ ---------------- */
        let BOARD_SIZE = 8;
        let boardState = [];
        let history = [];
        let selectedCell = null;
        let playerSide = 'W'; 
        let currentTurn = 'W'; 
        let recommendedMove = null;
        let mandatoryPiece = null;

        function cloneBoard(board) {
            let copy = new Array(BOARD_SIZE);
            for (let r = 0; r < BOARD_SIZE; r++) {
                copy[r] = new Array(BOARD_SIZE);
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    copy[r][c] = p ? { color: p.color, king: p.king } : null;
                }
            }
            return copy;
        }

        function changeBoardSize(size) {
            BOARD_SIZE = size;
            document.getElementById('size-6').classList.toggle('active', size === 6);
            document.getElementById('size-8').classList.toggle('active', size === 8);
            document.getElementById('size-10').classList.toggle('active', size === 10);
            initBoard();
        }

        function setPlayerSide(side) {
            playerSide = side;
            document.getElementById('side-w').classList.toggle('active', side === 'W');
            document.getElementById('side-b').classList.toggle('active', side === 'B');
            currentTurn = 'W';
            mandatoryPiece = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function updateTurnUI() {
            const wrapper = document.getElementById('board-wrapper');
            wrapper.classList.remove('turn-top', 'turn-bottom');
            if (currentTurn === playerSide) wrapper.classList.add('turn-bottom');
            else wrapper.classList.add('turn-top');
        }

        function initBoard() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            const rowsForPieces = BOARD_SIZE === 6 ? 2 : (BOARD_SIZE === 8 ? 3 : 4);

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < rowsForPieces) boardState[r][c] = { color: 'B', king: false };
                        else if (r >= BOARD_SIZE - rowsForPieces) boardState[r][c] = { color: 'W', king: false };
                    }
                }
            }
            history = [];
            selectedCell = null;
            recommendedMove = null;
            mandatoryPiece = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function handleCellClick(r, c) {
            if ((r + c) % 2 === 0) return;
            const p = boardState[r][c];
            const allValidMoves = getAllValidMoves(boardState, currentTurn);

            if (selectedCell) {
                const targetMove = allValidMoves.find(m => 
                    m.fromR === selectedCell.r && m.fromC === selectedCell.c &&
                    m.toR === r && m.toC === c
                );

                if (targetMove) {
                    saveHistory();
                    const isCapture = !!targetMove.capturedR;
                    executeMove(boardState, targetMove);
                    playSound(isCapture ? 'capture' : 'move');

                    if (isCapture) {
                        const nextJumps = getPieceJumps(boardState, r, c);
                        if (nextJumps.length > 0) {
                            mandatoryPiece = { r, c };
                            selectedCell = { r, c };
                            renderBoard();
                            calculateBestMove();
                            return;
                        }
                    }

                    mandatoryPiece = null;
                    selectedCell = null;
                    currentTurn = currentTurn === 'W' ? 'B' : 'W';
                    updateTurnUI();
                    renderBoard();
                    calculateBestMove();
                    return;
                }
            }

            if (p && p.color === currentTurn) {
                if (mandatoryPiece && (mandatoryPiece.r !== r || mandatoryPiece.c !== c)) {
                    return;
                }

                const pieceMoves = allValidMoves.filter(m => m.fromR === r && m.fromC === c);
                if (pieceMoves.length > 0) {
                    selectedCell = { r, c };
                    renderBoard();
                }
            } else if (!p) {
                selectedCell = null;
                renderBoard();
            }
        }

        function executeMove(board, move) {
            const p = board[move.fromR][move.fromC];
            board[move.toR][move.toC] = p;
            board[move.fromR][move.fromC] = null;

            if (move.capturedR !== undefined && move.capturedC !== undefined) {
                board[move.capturedR][move.capturedC] = null;
            }

            if (p.color === 'W' && move.toR === 0) p.king = true;
            if (p.color === 'B' && move.toR === BOARD_SIZE - 1) p.king = true;
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';

            const isMyTurn = (currentTurn === playerSide);
            const allValidMoves = getAllValidMoves(boardState, currentTurn);

            const currentPieceMoves = selectedCell ? 
                allValidMoves.filter(m => m.fromR === selectedCell.r && m.fromC === selectedCell.c) : [];

            for (let idxR = 0; idxR < BOARD_SIZE; idxR++) {
                for (let idxC = 0; idxC < BOARD_SIZE; idxC++) {
                    let r = playerSide === 'B' ? (BOARD_SIZE - 1 - idxR) : idxR;
                    let c = playerSide === 'B' ? (BOARD_SIZE - 1 - idxC) : idxC;

                    const cell = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    cell.className = `cell ${isDark ? 'dark' : 'light'}`;

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    if (currentPieceMoves.some(m => m.toR === r && m.toC === c)) {
                        cell.classList.add('valid-move');
                    }

                    if (isMyTurn && recommendedMove) {
                        if (recommendedMove.fromR === r && recommendedMove.fromC === c) {
                            cell.classList.add('best-from-player');
                        }
                        if (recommendedMove.toR === r && recommendedMove.toC === c) {
                            cell.classList.add('best-to-player');
                        }
                    }

                    const p = boardState[r][c];
                    if (p) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${p.color === 'W' ? 'white' : 'black'} ${p.king ? 'king' : ''}`;
                        cell.appendChild(pieceEl);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function getAllValidMoves(board, color) {
            let jumps = [];
            let simples = [];

            if (mandatoryPiece) {
                return getPieceJumps(board, mandatoryPiece.r, mandatoryPiece.c);
            }

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    if (p && p.color === color) {
                        let pJumps = getPieceJumps(board, r, c);
                        if (pJumps.length > 0) jumps.push(...pJumps);
                        if (jumps.length === 0) {
                            simples.push(...getPieceSimples(board, r, c));
                        }
                    }
                }
            }
            return jumps.length > 0 ? jumps : simples;
        }

        function getPieceSimples(board, r, c) {
            let p = board[r][c];
            let res = [];

            if (!p.king) {
                let dirs = p.color === 'W' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
                for (let [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && !board[nr][nc]) {
                        res.push({ fromR: r, fromC: c, toR: nr, toC: nc });
                    }
                }
            } else {
                let dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
                for (let [dr, dc] of dirs) {
                    let step = 1;
                    while (true) {
                        let nr = r + dr * step, nc = c + dc * step;
                        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;
                        if (board[nr][nc]) break;
                        res.push({ fromR: r, fromC: c, toR: nr, toC: nc });
                        step++;
                    }
                }
            }
            return res;
        }

        function getPieceJumps(board, r, c) {
            let p = board[r][c];
            let res = [];
            let dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];

            if (!p.king) {
                for (let [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    let jr = r + 2*dr, jc = c + 2*dc;
                    if (jr >= 0 && jr < BOARD_SIZE && jc >= 0 && jc < BOARD_SIZE) {
                        if (board[nr][nc] && board[nr][nc].color !== p.color && !board[jr][jc]) {
                            res.push({ fromR: r, fromC: c, toR: jr, toC: jc, capturedR: nr, capturedC: nc });
                        }
                    }
                }
            } else {
                for (let [dr, dc] of dirs) {
                    let step = 1;
                    let enemyR = -1, enemyC = -1;

                    while (true) {
                        let nr = r + dr * step, nc = c + dc * step;
                        if (nr < 0 || nr >= BOARD_SIZE || nc < 0 || nc >= BOARD_SIZE) break;

                        if (board[nr][nc]) {
                            if (board[nr][nc].color === p.color) break;
                            if (enemyR !== -1) break;
                            enemyR = nr;
                            enemyC = nc;
                        } else {
                            if (enemyR !== -1) {
                                res.push({ fromR: r, fromC: c, toR: nr, toC: nc, capturedR: enemyR, capturedC: enemyC });
                            }
                        }
                        step++;
                    }
                }
            }
            return res;
        }

        // ГЕНЕРАЦИЯ ПОЛНЫХ СЕРИЙ ВСЕХ ТРАЕКТОРИЙ ВЗЯТИЙ (Мульти-рубка для бота)
        function getFullCaptureSequences(board, color) {
            let allSequences = [];

            function searchChain(currBoard, r, c, currentChain) {
                let jumps = getPieceJumps(currBoard, r, c);
                if (jumps.length === 0) {
                    if (currentChain.length > 0) {
                        allSequences.push(currentChain);
                    }
                    return;
                }

                for (let j of jumps) {
                    let nextBoard = cloneBoard(currBoard);
                    executeMove(nextBoard, j);
                    searchChain(nextBoard, j.toR, j.toC, [...currentChain, j]);
                }
            }

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    if (p && p.color === color) {
                        searchChain(board, r, c, []);
                    }
                }
            }

            if (allSequences.length === 0) return [];

            // Правило русско-международных шашек (приоритет максимального взятия)
            let maxLen = Math.max(...allSequences.map(seq => seq.length));
            return allSequences.filter(seq => seq.length === maxLen);
        }

        function saveHistory() {
            history.push({
                board: cloneBoard(boardState),
                turn: currentTurn,
                mandatory: mandatoryPiece ? {...mandatoryPiece} : null
            });
        }

        function undoMove() {
            if (history.length === 0) return;
            const last = history.pop();
            boardState = last.board;
            currentTurn = last.turn;
            mandatoryPiece = last.mandatory;
            selectedCell = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        // РАСЧЕТ ЛУЧШЕГО ХОДА
        function calculateBestMove() {
            let moves = getAllValidMoves(boardState, currentTurn);

            if (moves.length === 0) {
                document.getElementById('best-move-text').innerText = "Партия завершена";
                recommendedMove = null;
                renderBoard();
                return;
            }

            let captureChains = getFullCaptureSequences(boardState, currentTurn);
            let bestMove = null;
            let bestScore = -Infinity;

            if (captureChains.length > 0) {
                for (let chain of captureChains) {
                    let tempBoard = cloneBoard(boardState);
                    for (let stepMove of chain) {
                        executeMove(tempBoard, stepMove);
                    }
                    let score = minimax(tempBoard, 4, -Infinity, Infinity, false, currentTurn);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = chain[0]; // Возвращаем первый шаг оптимальной серии
                    }
                }
            } else {
                for (let move of moves) {
                    let tempBoard = cloneBoard(boardState);
                    executeMove(tempBoard, move);
                    let score = minimax(tempBoard, 4, -Infinity, Infinity, false, currentTurn);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMove = move;
                    }
                }
            }

            recommendedMove = bestMove;
            const cols = ['A','B','C','D','E','F','G','H','I','J'];
            const fromStr = `${cols[bestMove.fromC]}${BOARD_SIZE - bestMove.fromR}`;
            const toStr = `${cols[bestMove.toC]}${BOARD_SIZE - bestMove.toR}`;

            document.getElementById('best-move-text').innerText = `Лучший ход: ${fromStr} ➔ ${toStr}`;
            renderBoard();
        }

        // АЛГОРИТМ MINIMAX С КВИЕСЦЕНТНЫМ ПОИСКОМ (Поиск тишины)
        function minimax(board, depth, alpha, beta, isMaximizing, myColor) {
            let oppColor = myColor === 'W' ? 'B' : 'W';
            let currColor = isMaximizing ? myColor : oppColor;

            if (depth === 0) {
                return quiescenceSearch(board, alpha, beta, isMaximizing, myColor, 2);
            }

            let captureChains = getFullCaptureSequences(board, currColor);

            if (captureChains.length > 0) {
                if (isMaximizing) {
                    let maxEval = -Infinity;
                    for (let chain of captureChains) {
                        let bCopy = cloneBoard(board);
                        for (let stepMove of chain) executeMove(bCopy, stepMove);
                        let evalVal = minimax(bCopy, depth - 1, alpha, beta, false, myColor);
                        maxEval = Math.max(maxEval, evalVal);
                        alpha = Math.max(alpha, evalVal);
                        if (beta <= alpha) break;
                    }
                    return maxEval;
                } else {
                    let minEval = Infinity;
                    for (let chain of captureChains) {
                        let bCopy = cloneBoard(board);
                        for (let stepMove of chain) executeMove(bCopy, stepMove);
                        let evalVal = minimax(bCopy, depth - 1, alpha, beta, true, myColor);
                        minEval = Math.min(minEval, evalVal);
                        beta = Math.min(beta, evalVal);
                        if (beta <= alpha) break;
                    }
                    return minEval;
                }
            }

            let moves = getAllValidMoves(board, currColor);
            if (moves.length === 0) return isMaximizing ? -1000 : 1000;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let m of moves) {
                    let bCopy = cloneBoard(board);
                    executeMove(bCopy, m);
                    let evalVal = minimax(bCopy, depth - 1, alpha, beta, false, myColor);
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let m of moves) {
                    let bCopy = cloneBoard(board);
                    executeMove(bCopy, m);
                    let evalVal = minimax(bCopy, depth - 1, alpha, beta, true, myColor);
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // Поиск тишины: досчитывает взятия после завершения основной глубины
        function quiescenceSearch(board, alpha, beta, isMaximizing, myColor, qDepth) {
            let standPat = evaluateBoard(board, myColor);
            if (qDepth === 0) return standPat;

            let oppColor = myColor === 'W' ? 'B' : 'W';
            let currColor = isMaximizing ? myColor : oppColor;
            let captureChains = getFullCaptureSequences(board, currColor);

            if (captureChains.length === 0) return standPat;

            if (isMaximizing) {
                let maxEval = standPat;
                for (let chain of captureChains) {
                    let bCopy = cloneBoard(board);
                    for (let stepMove of chain) executeMove(bCopy, stepMove);
                    let evalVal = quiescenceSearch(bCopy, alpha, beta, false, myColor, qDepth - 1);
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = standPat;
                for (let chain of captureChains) {
                    let bCopy = cloneBoard(board);
                    for (let stepMove of chain) executeMove(bCopy, stepMove);
                    let evalVal = quiescenceSearch(bCopy, alpha, beta, true, myColor, qDepth - 1);
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        // ПРОФЕССИОНАЛЬНАЯ ОЦЕНКА ПОЗИЦИИ (EVALUATION FUNCTION)
        function evaluateBoard(board, myColor) {
            let score = 0;
            let oppColor = myColor === 'W' ? 'B' : 'W';

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    if (!p) continue;

                    let val = p.king ? 5.0 : 1.0;

                    // Продвижение простых шашек
                    if (!p.king) {
                        let advance = (p.color === 'W' ? (BOARD_SIZE - 1 - r) : r);
                        val += advance * 0.12;
                    }

                    // Бортовой бонус (шашки на краю защищены от срубов)
                    if (c === 0 || c === BOARD_SIZE - 1) {
                        val += 0.25;
                    }

                    // Контроль центральных полей
                    if (r >= 2 && r <= BOARD_SIZE - 3 && c >= 2 && c <= BOARD_SIZE - 3) {
                        val += 0.2;
                    }

                    // Бонус за сохранение последнего ряда (золотые шашки)
                    if (!p.king) {
                        if (p.color === 'W' && r === BOARD_SIZE - 1) val += 0.4;
                        if (p.color === 'B' && r === 0) val += 0.4;
                    }

                    if (p.color === myColor) score += val;
                    else score -= val;
                }
            }
            return score;
        }

        function resetBoard() {
            initBoard();
        }

        initBoard();
    </script>
