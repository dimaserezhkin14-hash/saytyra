<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini App</title>
    <!-- Подключение библиотеки Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e24;
            border: 1px solid #2d2d38;
            border-radius: 20px;
            padding: 28px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0088cc, #005588);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #9a9ab0;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #0088cc;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
            background: #0077b5;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="user-avatar" id="avatar">👋</div>
        <h1 id="greeting">Привет!</h1>
        <p>Добро пожаловать в приложение. Вы успешно перешли по кнопке из группы.</p>
        
        <button class="btn" onclick="closeApp()">Закрыть приложение</button>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачивает окно на весь экран

        // Получение данных пользователя из Telegram
        const user = tg.initDataUnsafe?.user;

        if (user) {
            const name = user.first_name || "Пользователь";
            document.getElementById('greeting').textContent = `Привет, ${name}!`;
        }

        function closeApp() {
            tg.close(); // Закрывает Mini App
        }
    </script>

</body>
</html>
