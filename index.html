<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Шашек Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.4);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.5);
            --text: #f8fafc;
            --board-light: #e2e8f0;
            --board-dark: #334155;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0b0f19 70%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            padding-bottom: 75px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* СТАРТОВЫЙ ОВЕРЛЕЙ */
        .start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.96);
            backdrop-filter: blur(15px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .start-btn {
            padding: 16px 36px;
            font-size: 18px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.5);
            cursor: pointer;
        }

        /* ВКЛАДКИ (СТРАНИЦЫ) */
        .tab-content {
            width: 100%;
            max-width: 400px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        .tab-content.active {
            display: flex;
        }

        /* ИНФО-БАР ОЦЕНКИ */
        .eval-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-align: center;
            margin-bottom: 12px;
        }

        .eval-status { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .eval-best { font-size: 15px; color: var(--green); font-weight: 800; margin-top: 2px; }

        /* ДОСКА */
        .board-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(15, 23, 42, 0.9);
            padding: 8px;
            border-radius: 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            transition: border-color 0.4s, box-shadow 0.4s;
            position: relative;
        }

        /* ПОДСВЕТКА ОЧЕРЕДИ ХОДА (ПОЛОВИНЫ ДОСКИ) */
        .board-wrapper.turn-top {
            border-top-color: var(--accent);
            box-shadow: 0 -8px 20px rgba(59, 130, 246, 0.3);
        }
        .board-wrapper.turn-bottom {
            border-bottom-color: var(--accent);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            border-radius: 12px;
            overflow: hidden;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .cell.light { background-color: var(--board-light); }
        .cell.dark { background-color: var(--board-dark); }
        .cell.selected { background-color: #2563eb !important; }

        /* ПОДСВЕТКА ТОЛЬКО ДЛЯ ИГРОКА */
        .cell.best-from-player { background-color: #047857 !important; animation: pulse-green 1.5s infinite alternate; }
        .cell.best-to-player { background-color: #10b981 !important; animation: pulse-green 1.5s infinite alternate; }

        @keyframes pulse-green {
            0% { box-shadow: inset 0 0 5px var(--green-glow); }
            100% { box-shadow: inset 0 0 18px var(--green); }
        }

        /* ШАШКИ */
        .piece {
            width: 80%;
            height: 80%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .piece.white {
            background: radial-gradient(circle at 35% 35%, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .piece.black {
            background: radial-gradient(circle at 35% 35%, #334155, #0f172a);
            border: 2px solid #020617;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
        }

        .piece.king::after { content: '👑'; font-size: 16px; }

        /* КНОПКИ УПРАВЛЕНИЯ НА ЭКРАНЕ ИГРЫ */
        .controls-grid {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 12px;
        }

        .btn-action {
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            background: var(--card-bg);
            text-align: center;
        }

        .btn-calc { background: var(--green); border: none; }

        /* ЭКРАН НАСТРОЕК */
        .settings-card {
            width: 100%;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-title { font-size: 13px; font-weight: 700; color: #f8fafc; }

        .selector-group {
            display: flex;
            gap: 4px;
            background: rgba(15, 23, 42, 0.6);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .pill-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .pill-btn.active {
            background: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 12px var(--accent-glow);
        }

        /* НИЖНИЙ ТАББАР */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            width: 50%;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ОВЕРЛЕЙ -->
    <div class="start-overlay" id="start-overlay">
        <h2 style="margin-bottom: 8px;">🎯 Шашки Pro</h2>
        <p style="color: #94a3b8; font-size: 13px; margin-bottom: 24px;">Нажмите кнопку для старта и захода в игру</p>
        <button class="start-btn" onclick="startApp()">Войти в приложение 🚀</button>
    </div>

    <!-- ВЕБ-АПП СТРАНИЦЫ -->
    
    <!-- 1. ВНЕШНИЙ ВИД / ИГРА -->
    <div class="tab-content active" id="tab-game">
        <div class="eval-card">
            <div class="eval-status" id="eval-status">Анализ позиции...</div>
            <div class="eval-best" id="best-move-text">Расчёт...</div>
        </div>

        <div class="board-wrapper" id="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="controls-grid">
            <button class="btn-action" onclick="undoMove()">↩️ Назад</button>
            <button class="btn-action" style="color: #fca5a5;" onclick="resetBoard()">🔄 Сброс</button>
            <button class="btn-action btn-calc" onclick="calculateBestMove()">💡 Расчёт</button>
        </div>
    </div>

    <!-- 2. НАСТРОЙКИ И ПРОФИЛЬ -->
    <div class="tab-content" id="tab-settings">
        <div class="settings-card">
            <h3 style="margin: 0 0 8px 0; font-size: 16px;">⚙️ Настройки игры</h3>
            
            <div class="setting-row">
                <span class="setting-title">Размер доски:</span>
                <div class="selector-group">
                    <button class="pill-btn" onclick="changeBoardSize(6)">6x6</button>
                    <button class="pill-btn active" id="size-8" onclick="changeBoardSize(8)">8x8</button>
                    <button class="pill-btn" onclick="changeBoardSize(10)">10x10</button>
                </div>
            </div>

            <div class="setting-row">
                <span class="setting-title">Я играю за:</span>
                <div class="selector-group">
                    <button class="pill-btn active" id="side-w" onclick="setPlayerSide('W')">⚪️ Белых</button>
                    <button class="pill-btn" id="side-b" onclick="setPlayerSide('B')">⚫️ Чёрных</button>
                </div>
            </div>

            <div class="setting-row">
                <span class="setting-title">Чей сейчас ход:</span>
                <div class="selector-group">
                    <button class="pill-btn active" id="turn-w" onclick="setTurn('W')">⚪️ Белые</button>
                    <button class="pill-btn" id="turn-b" onclick="setTurn('B')">⚫️ Чёрные</button>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 4px 0;">

            <div class="setting-row">
                <span class="setting-title">Фоновая музыка:</span>
                <button class="pill-btn active" id="toggle-music" onclick="toggleMusic()">🎵 ВКЛ</button>
            </div>
        </div>
    </div>

    <!-- НИЖНИЙ ТАББАР -->
    <div class="bottom-nav">
        <div class="nav-item active" id="nav-game" onclick="switchTab('game')">
            <span class="nav-icon">🎮</span>
            <span>Доска</span>
        </div>
        <div class="nav-item" id="nav-settings" onclick="switchTab('settings')">
            <span class="nav-icon">⚙️</span>
            <span>Настройки</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ТОЧНЫЙ МАССИВ ВАШИХ ТРЕКОВ
        const playlist = [
            "2_5235792221629884133.mp3",
            "2_5246842657086400740.mp3",
            "2_5298507548834436762.mp3",
            "2_5299002548110272662.mp3",
            "6508223425_2349259877.m4a"
        ];

        let currentTrackIdx = 0;
        let audioPlayer = new Audio();
        let isMusicOn = true;

        function startApp() {
            document.getElementById('start-overlay').style.display = 'none';
            playTrack(currentTrackIdx);
        }

        function playTrack(idx) {
            if (!isMusicOn) return;
            
            currentTrackIdx = idx % playlist.length;
            audioPlayer.src = playlist[currentTrackIdx];
            audioPlayer.volume = 0.25;
            
            audioPlayer.play().catch(e => {
                console.warn(`Ошибка воспроизведения ${playlist[currentTrackIdx]}:`, e);
            });
        }

        audioPlayer.addEventListener('ended', () => {
            playTrack(currentTrackIdx + 1);
        });

        audioPlayer.addEventListener('error', (e) => {
            console.error(`Не удалось загрузить аудиофайл: ${playlist[currentTrackIdx]}`);
            if (isMusicOn) {
                playTrack(currentTrackIdx + 1);
            }
        });

        function toggleMusic() {
            isMusicOn = !isMusicOn;
            const btn = document.getElementById('toggle-music');
            if (isMusicOn) {
                btn.classList.add('active');
                btn.innerText = "🎵 ВКЛ";
                playTrack(currentTrackIdx);
            } else {
                btn.classList.remove('active');
                btn.innerText = "🔇 ВЫКЛ";
                audioPlayer.pause();
            }
        }

        // НАВИГАЦИЯ ПО ВКЛАДКАМ
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (tab === 'game') {
                document.getElementById('tab-game').classList.add('active');
                document.getElementById('nav-game').classList.add('active');
            } else {
                document.getElementById('tab-settings').classList.add('active');
                document.getElementById('nav-settings').classList.add('active');
            }
        }

        // СОСТОЯНИЕ ИГРЫ
        let BOARD_SIZE = 8;
        let boardState = [];
        let history = [];
        let selectedCell = null;
        let playerSide = 'W'; 
        let currentTurn = 'W'; 
        let recommendedMove = null;

        function changeBoardSize(size) {
            BOARD_SIZE = size;
            initBoard();
        }

        function setPlayerSide(side) {
            playerSide = side;
            document.getElementById('side-w').classList.toggle('active', side === 'W');
            document.getElementById('side-b').classList.toggle('active', side === 'B');
            
            currentTurn = 'W';
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function setTurn(color) {
            currentTurn = color;
            updateTurnUI();
            calculateBestMove();
        }

        function updateTurnUI() {
            document.getElementById('turn-w').classList.toggle('active', currentTurn === 'W');
            document.getElementById('turn-b').classList.toggle('active', currentTurn === 'B');

            const wrapper = document.getElementById('board-wrapper');
            wrapper.classList.remove('turn-top', 'turn-bottom');

            if (currentTurn === playerSide) {
                wrapper.classList.add('turn-bottom');
            } else {
                wrapper.classList.add('turn-top');
            }
        }

        function initBoard() {
            boardState = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(null));
            const rowsForPieces = BOARD_SIZE === 6 ? 2 : (BOARD_SIZE === 8 ? 3 : 4);

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < rowsForPieces) boardState[r][c] = { color: 'B', king: false };
                        else if (r >= BOARD_SIZE - rowsForPieces) boardState[r][c] = { color: 'W', king: false };
                    }
                }
            }
            history = [];
            selectedCell = null;
            recommendedMove = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.style.gridTemplateColumns = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${BOARD_SIZE}, 1fr)`;
            boardEl.innerHTML = '';

            const isMyTurn = (currentTurn === playerSide);

            for (let idxR = 0; idxR < BOARD_SIZE; idxR++) {
                for (let idxC = 0; idxC < BOARD_SIZE; idxC++) {
                    let r = playerSide === 'B' ? (BOARD_SIZE - 1 - idxR) : idxR;
                    let c = playerSide === 'B' ? (BOARD_SIZE - 1 - idxC) : idxC;

                    const cell = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    cell.className = `cell ${isDark ? 'dark' : 'light'}`;

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    if (isMyTurn && recommendedMove) {
                        if (recommendedMove.fromR === r && recommendedMove.fromC === c) {
                            cell.classList.add('best-from-player');
                        }
                        if (recommendedMove.toR === r && recommendedMove.toC === c) {
                            cell.classList.add('best-to-player');
                        }
                    }

                    const p = boardState[r][c];
                    if (p) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${p.color === 'W' ? 'white' : 'black'} ${p.king ? 'king' : ''}`;
                        cell.appendChild(pieceEl);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if ((r + c) % 2 === 0) return;
            const p = boardState[r][c];

            if (selectedCell && !p) {
                saveHistory();
                makeMove(boardState, selectedCell.r, selectedCell.c, r, c);
                selectedCell = null;
                currentTurn = currentTurn === 'W' ? 'B' : 'W';
                updateTurnUI();
                renderBoard();
                calculateBestMove();
                return;
            }

            if (p) {
                selectedCell = { r, c };
                renderBoard();
            }
        }

        function makeMove(board, fromR, fromC, toR, toC) {
            const p = board[fromR][fromC];
            board[toR][toC] = p;
            board[fromR][fromC] = null;

            if (Math.abs(toR - fromR) >= 2) {
                const midR = (fromR + toR) / 2;
                const midC = (fromC + toC) / 2;
                board[midR][midC] = null;
            }

            if (p.color === 'W' && toR === 0) p.king = true;
            if (p.color === 'B' && toR === BOARD_SIZE - 1) p.king = true;
        }

        function saveHistory() {
            history.push({
                board: JSON.parse(JSON.stringify(boardState)),
                turn: currentTurn
            });
        }

        function undoMove() {
            if (history.length === 0) return;
            const last = history.pop();
            boardState = last.board;
            currentTurn = last.turn;
            selectedCell = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function calculateBestMove() {
            let moves = getAllValidMoves(boardState, currentTurn);

            if (moves.length === 0) {
      document.getElementById('eval-status').innerText = "Статус: Завершено";
                document.getElementById('best-move-text').innerText = "Нет доступных ходов";
                recommendedMove = null;
                renderBoard();
                return;
            }

            let bestMove = null;
            let bestScore = -Infinity;

            for (let move of moves) {
                let tempBoard = JSON.parse(JSON.stringify(boardState));
                makeMove(tempBoard, move.fromR, move.fromC, move.toR, move.toC);
                let score = minimax(tempBoard, 3, -Infinity, Infinity, false, currentTurn);
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = move;
                }
            }

            recommendedMove = bestMove;
            const cols = ['A','B','C','D','E','F','G','H','I','J'];
            const fromStr = `${cols[bestMove.fromC]}${BOARD_SIZE - bestMove.fromR}`;
            const toStr = `${cols[bestMove.toC]}${BOARD_SIZE - bestMove.toR}`;

            const isMyTurn = (currentTurn === playerSide);
            document.getElementById('eval-status').innerText = isMyTurn ? "Ваш ход (лучший вариант):" : "Ожидание хода противника...";
            document.getElementById('best-move-text').innerText = isMyTurn ? `Ходите: ${fromStr} ➔ ${toStr}` : "Противник думает...";

            renderBoard();
        }

        function minimax(board, depth, alpha, beta, isMaximizing, myColor) {
            if (depth === 0) return evaluateBoard(board, myColor);

            let oppColor = myColor === 'W' ? 'B' : 'W';
            let currColor = isMaximizing ? myColor : oppColor;
            let moves = getAllValidMoves(board, currColor);

            if (moves.length === 0) return isMaximizing ? -1000 : 1000;

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let m of moves) {
                    let bCopy = JSON.parse(JSON.stringify(board));
                    makeMove(bCopy, m.fromR, m.fromC, m.toR, m.toC);
                    let eval = minimax(bCopy, depth - 1, alpha, beta, false, myColor);
                    maxEval = Math.max(maxEval, eval);
                    alpha = Math.max(alpha, eval);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let m of moves) {
                    let bCopy = JSON.parse(JSON.stringify(board));
                    makeMove(bCopy, m.fromR, m.fromC, m.toR, m.toC);
                    let eval = minimax(bCopy, depth - 1, alpha, beta, true, myColor);
                    minEval = Math.min(minEval, eval);
                    beta = Math.min(beta, eval);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard(board, myColor) {
            let score = 0;
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    if (p) {
                        let val = p.king ? 3.5 : 1.0;
                        val += (p.color === 'W' ? (BOARD_SIZE - 1 - r) : r) * 0.1;
                        if (p.color === myColor) score += val;
                        else score -= val;
                    }
                }
            }
            return score;
        }

        function getAllValidMoves(board, color) {
            let jumps = [];
            let simples = [];

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    let p = board[r][c];
                    if (p && p.color === color) {
                        let pJumps = getPieceJumps(board, r, c);
                        if (pJumps.length > 0) jumps.push(...pJumps);
                        if (jumps.length === 0) {
                            simples.push(...getPieceSimples(board, r, c));
                        }
                    }
                }
            }
            return jumps.length > 0 ? jumps : simples;
        }

        function getPieceSimples(board, r, c) {
            let p = board[r][c];
            let res = [];
            let dirs = p.king ? [[-1,-1],[-1,1],[1,-1],[1,1]] : (p.color === 'W' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && !board[nr][nc]) {
                    res.push({ fromR: r, fromC: c, toR: nr, toC: nc });
                }
            }
            return res;
        }

        function getPieceJumps(board, r, c) {
            let p = board[r][c];
            let res = [];
            let dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                let jr = r + 2*dr, jc = c + 2*dc;
                if (jr >= 0 && jr < BOARD_SIZE && jc >= 0 && jc < BOARD_SIZE) {
                    if (board[nr][nc] && board[nr][nc].color !== p.color && !board[jr][jc]) {
                        res.push({ fromR: r, fromC: c, toR: jr, toC: jc });
                    }
                }
            }
            return res;
        }

        function resetBoard() {
            initBoard();
        }

        initBoard();
    </script>
