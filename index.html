<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Алдиярчик на букаке</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .bukake-particle {
            position: absolute;
            font-weight: bold;
            pointer-events: none;
            opacity: 0.7;
            animation: fall linear infinite;
            white-space: nowrap;
            z-index: 1;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        .container {
            max-width: 400px;
            width: 100%;
            position: relative;
            z-index: 2;
            background: rgba(18, 18, 18, 0.85);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
        }

        img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }

        h1 {
            font-size: 22px;
            margin: 10px 0 5px 0;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        }

        h3 {
            font-size: 16px;
            margin: 0 0 15px 0;
            color: #a4b0be;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: #fff;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            width: 100%;
        }

        button:active {
            transform: scale(0.95);
        }

        #output {
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
            min-height: 25px;
        }
    </style>
</head>
<body>

<div class="container">
    <img src="dog.jpg" alt="Алдиярчик">
    
    <h1>Алдиярчик на букаке</h1>
    <h3>Запись на процедуру</h3>

    <form id="orderForm" onsubmit="sendToTelegram(event)">
        <input type="text" id="clientName" placeholder="Твое имя" required>
        <input type="tel" id="clientPhone" placeholder="Номер телефона" required>
        <button type="submit">Оставить заявку</button>
    </form>

    <div id="output"></div>
</div>

<script>
    const BOT_TOKEN = "8980295775:AAHVR7lRM_NK2p9_ep-YfrEfXCpumfFYU-c";
    const CHAT_ID = "6508223425";

    const colors = ["#2ed573", "#ff4757", "#ffa502", "#1e90ff", "#9b59b6", "#00d2d3", "#ff6b81"];

    function sendToTelegram(event) {
        event.preventDefault();
        const name = document.getElementById('clientName').value;
        const phone = document.getElementById('clientPhone').value;
        const out = document.getElementById("output");

        const message = `🔥 Новая заявка с сайта!\n👤 Имя: ${name}\n📞 Телефон: ${phone}`;
        const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(message)}`;

        out.textContent = "Отправка...";
        out.style.color = "#ffa502";

        fetch(url)
            .then(response => {
                if (response.ok) {
                    out.textContent = "✅ Заявка успешно отправлена!";
                    out.style.color = "#2ed573";
                    document.getElementById('orderForm').reset();
                } else {
                    out.textContent = "❌ Ошибка при отправке.";
                    out.style.color = "#ff4757";
                }
            })
            .catch(() => {
                out.textContent = "❌ Ошибка сети.";
                out.style.color = "#ff4757";
            });
    }

    function createBukakeRain() {
        const text = document.createElement('div');
        text.className = 'bukake-particle';
        text.textContent = 'БУКАКЕ';
        text.style.left = Math.random() * 100 + 'vw';
        text.style.top = '-50px';
        text.style.fontSize = (Math.random() * 16 + 12) + 'px';
        text.style.color = colors[Math.floor(Math.random() * colors.length)];
        
        const duration = Math.random() * 3 + 2;
        text.style.animationDuration = duration + 's';

        document.body.appendChild(text);
        setTimeout(() => text.remove(), duration * 1000);
    }

    setInterval(createBukakeRain, 300);
</script>

</body>
</html>
