<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop & Rate</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90vh;
        }

        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            height: 220px;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            margin: 12px 0 4px 0;
        }

        .author {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-skip {
            background: #2c2c2e;
            color: #ff453a;
        }

        .btn-drop {
            background: #30d158;
            color: #000000;
        }

        .stats {
            margin-top: 12px;
            font-size: 12px;
            color: #636366;
        }
    </style>
</head>
<body>

    <div class="card" id="card">
        <img id="item-img" src="" alt="Cover">
        <div class="title" id="item-title">Загрузка...</div>
        <div class="author" id="item-author">@username</div>

        <div class="buttons">
            <button class="btn btn-skip" onclick="handleVote('dislike')">👎 Skip</button>
            <button class="btn btn-drop" onclick="handleVote('like')">🔥 Drop</button>
        </div>

        <div class="stats" id="item-stats">🔥 0 | 👎 0</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let items = [];
        let currentIndex = 0;

        async function loadItems() {
            try {
                const res = await fetch('/api/items');
                const data = await res.json();
                items = data.items;
                showCurrentItem();
            } catch (e) {
                console.error("Ошибка загрузки данных", e);
            }
        }

        function showCurrentItem() {
            if (currentIndex >= items.length) {
                document.getElementById('card').innerHTML = '<h2>Все работы оценены! 🎉</h2><p style="color:#8e8e93">Заходи позже за новыми треками и артами.</p>';
                return;
            }

            const item = items[currentIndex];
            document.getElementById('item-img').src = item.image;
            document.getElementById('item-title').innerText = item.title;
            document.getElementById('item-author').innerText = item.author;
            document.getElementById('item-stats').innerText = `🔥 ${item.likes} | 👎 ${item.dislikes}`;
        }

        async function handleVote(action) {
            if (currentIndex >= items.length) return;

            const item = items[currentIndex];
            const userId = tg.initDataUnsafe?.user?.id || 0;

            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            await fetch('/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    item_id: item.id,
                    action: action,
                    user_id: userId
                })
            });

            currentIndex++;
            showCurrentItem();
        }

        loadItems();
    </script>
</body>
</html>
