<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Калькулятор Шашек</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #3b82f6;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f8fafc;
            --board-light: #cbd5e1;
            --board-dark: #334155;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card);
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid #475569;
            margin-bottom: 10px;
        }

        .turn-selector {
            display: flex;
            gap: 6px;
        }

        .turn-btn {
            padding: 6px 12px;
            border: 1px solid #475569;
            background: #020617;
            color: #94a3b8;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .turn-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ПОДСКАЗКА КАЛЬКУЛЯТОРА */
        .eval-box {
            width: 100%;
            max-width: 380px;
            background: var(--card);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #475569;
            text-align: center;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .eval-best {
            color: var(--green);
            font-size: 15px;
            margin-top: 4px;
        }

        /* ДОСКА */
        .board-container {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1 / 1;
            background: #020617;
            padding: 6px;
            border-radius: 12px;
            border: 2px solid #475569;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border-radius: 6px;
            overflow: hidden;
        }

        .cell {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .cell.light { background-color: var(--board-light); }
        .cell.dark { background-color: var(--board-dark); }

        .cell.selected { background-color: #3b82f6 !important; }
        .cell.best-from { background-color: #15803d !important; } /* Идеальная фигура для хода */
        .cell.best-to { background-color: #22c55e !important; } /* Идеальная клетка прихода */
        .cell.best-to::after {
            content: '★';
            color: #fff;
            font-size: 16px;
        }

        /* ШАШКИ */
        .piece {
            width: 82%;
            height: 82%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 -4px 4px rgba(0,0,0,0.4), 0 4px 6px rgba(0,0,0,0.5);
        }

        .piece.white {
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            border: 2px solid #94a3b8;
        }

        .piece.black {
            background: linear-gradient(135deg, #1e293b, #020617);
            border: 2px solid #000;
        }

        .piece.king::after {
            content: '👑';
            font-size: 16px;
        }

        /* КНОПКИ УПРАВЛЕНИЯ */
        .controls {
            width: 100%;
            max-width: 380px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-top: 12px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            color: #fff;
        }

        .btn-undo { background: #64748b; }
        .btn-reset { background: var(--red); }
        .btn-calc { background: var(--green); }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight: bold; font-size: 13px;">Чей ход:</span>
        <div class="turn-selector">
            <button class="turn-btn active" id="turn-w" onclick="setTurn('W')">Белые</button>
            <button class="turn-btn" id="turn-b" onclick="setTurn('B')">Чёрные</button>
        </div>
    </div>

    <div class="eval-box">
        <div id="eval-score">Оценка: Просчёт...</div>
        <div class="eval-best" id="best-move-text">Лучший ход: -</div>
    </div>

    <div class="board-container">
        <div class="board" id="board"></div>
    </div>

    <div class="controls">
        <button class="btn btn-undo" onclick="undoMove()">↩️ Назад</button>
        <button class="btn btn-reset" onclick="resetBoard()">🔄 Сброс</button>
        <button class="btn btn-calc" onclick="calculateBestMove()">💡 Расчёт</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let boardState = [];
        let history = [];
        let selectedCell = null;
        let currentTurn = 'W'; // 'W' или 'B'
        let recommendedMove = null;

        function initBoard() {
            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        if (r < 3) boardState[r][c] = { color: 'B', king: false };
                        else if (r > 4) boardState[r][c] = { color: 'W', king: false };
                    }
                }
            }
            history = [];
            selectedCell = null;
            recommendedMove = null;
            renderBoard();
            calculateBestMove();
        }

        function saveHistory() {
            history.push({
                board: JSON.parse(JSON.stringify(boardState)),
                turn: currentTurn
            });
        }

        function undoMove() {
            if (history.length === 0) return;
            const lastState = history.pop();
            boardState = lastState.board;
            currentTurn = lastState.turn;
            selectedCell = null;
            updateTurnUI();
            renderBoard();
            calculateBestMove();
        }

        function setTurn(color) {
            currentTurn = color;
            updateTurnUI();
            calculateBestMove();
        }

        function updateTurnUI() {
            document.getElementById('turn-w').classList.toggle('active', currentTurn === 'W');
            document.getElementById('turn-b').classList.toggle('active', currentTurn === 'B');
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const cell = document.createElement('div');
                    const isDark = (r + c) % 2 === 1;
                    cell.className = `cell ${isDark ? 'dark' : 'light'}`;

                    if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
                        cell.classList.add('selected');
                    }

                    // Подсветка идеального хода
                    if (recommendedMove) {
                        if (recommendedMove.fromR === r && recommendedMove.fromC === c) {
                            cell.classList.add('best-from');
                        }
                        if (recommendedMove.toR === r && recommendedMove.toC === c) {
                            cell.classList.add('best-to');
                        }
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.className = `piece ${piece.color === 'W' ? 'white' : 'black'} ${piece.king ? 'king' : ''}`;
                        cell.appendChild(pieceEl);
                    }

                    cell.addEventListener('click', () => handleCellClick(r, c));
                    boardEl.appendChild(cell);
                }
            }
        }

        function handleCellClick(r, c) {
            if ((r + c) % 2 === 0) return; // Только на тёмных клетках

            const piece = boardState[r][c];

            // Если выбрана фигура и кликаем на пустую клетку — делаем ход
            if (selectedCell && !piece) {
                saveHistory();
                makeMove(selectedCell.r, selectedCell.c, r, c);
                selectedCell = null;
                // Авто-переключение хода на противоположный
                currentTurn = currentTurn === 'W' ? 'B' : 'W';
                updateTurnUI();
                renderBoard();
                calculateBestMove();
                return;
            }

            // Выбор фигуры
            if (piece) {
                selectedCell = { r, c };
                renderBoard();
            }
        }

        function makeMove(fromR, fromC, toR, toC) {
            const piece = boardState[fromR][fromC];
            boardState[toR][toC] = piece;
            boardState[fromR][fromC] = null;

            // Удаление срубленной фигуры (если прыжок)
            if (Math.abs(toR - fromR) >= 2) {
                const midR = (fromR + toR) / 2;
                const midC = (fromC + toC) / 2;
                boardState[midR][midC] = null;
            }

            // Проводка в дамки
            if (piece.color === 'W' && toR === 0) piece.king = true;
            if (piece.color === 'B' && toR === 7) piece.king = true;
        }

        // --- ДВИЖОК-КАЛЬКУЛЯТОР ---
        function calculateBestMove() {
            let moves = generateAllMoves(boardState, currentTurn);

            if (moves.length === 0) {
                document.getElementById('eval-score').innerText = "Позиция: Нет ходов";
                document.getElementById('best-move-text').innerText = "Мат / Тупик";
                recommendedMove = null;
                renderBoard();
                return;
            }

            // Поиск лучшего хода (глубина просчета)
            let bestMove = moves[0];
            let bestValue = -9999;

            for (let move of moves) {
                let val = evaluateMove(move);
                if (val > bestValue) {
                    bestValue = val;
                    bestMove = move;
                }
            }

            recommendedMove = bestMove;
            const cols = ['A','B','C','D','E','F','G','H'];
            const fromStr = `${cols[bestMove.fromC]}${8 - bestMove.fromR}`;
            const toStr = `${cols[bestMove.toC]}${8 - bestMove.toR}`;

            document.getElementById('eval-score').innerText = `Позиция: ${bestValue >= 0 ? '+' : ''}${bestValue}`;
            document.getElementById('best-move-text').innerText = `Рекомендация: ${fromStr} ➔ ${toStr}`;
            
            renderBoard();
        }

        function generateAllMoves(board, color) {
            let jumps = [];
            let simpleMoves = [];

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const p = board[r][c];
                    if (p && p.color === color) {
                        // Поиск прыжков (рубок)
                        const pJumps = getPieceJumps(board, r, c);
                        if (pJumps.length > 0) jumps.push(...pJumps);
                        
                        // Простые ходы
                        if (jumps.length === 0) {
                            const pMoves = getPieceSimpleMoves(board, r, c);
                            simpleMoves.push(...pMoves);
                        }
                    }
                }
            }
            return jumps.length > 0 ? jumps : simpleMoves;
        }

        function getPieceSimpleMoves(board, r, c) {
            const p = board[r][c];
            let res = [];
            const dirs = p.king ? [[-1,-1],[-1,1],[1,-1],[1,1]] : (p.color === 'W' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]]);

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && !board[nr][nc]) {
                    res.push({ fromR: r, fromC: c, toR: nr, toC: nc, isJump: false });
                }
            }
            return res;
        }

        function getPieceJumps(board, r, c) {
            const p = board[r][c];
            let res = [];
            const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];

            for (let [dr, dc] of dirs) {
                let nr = r + dr, nc = c + dc;
                let jr = r + 2*dr, jc = c + 2*dc;
                if (jr >= 0 && jr < 8 && jc >= 0 && jc < 8) {
                    if (board[nr][nc] && board[nr][nc].color !== p.color && !board[jr][jc]) {
                        res.push({ fromR: r, fromC: c, toR: jr, toC: jc, isJump: true });
                    }
                }
            }
            return res;
        }

        function evaluateMove(move) {
            let score = 0;
            if (move.isJump) score += 30; // Обязательное срубание
            if ((currentTurn === 'W' && move.toR === 0) || (currentTurn === 'B' && move.toR === 7)) {
                score += 50; // Выход в дамки
            }
            // Контроль центра
            if (move.toC >= 2 && move.toC <= 5 && move.toR >= 2 && move.toR <= 5) score += 10;
            return score;
        }

        function resetBoard() {
            initBoard();
        }

        initBoard();
    </script>
</body>
</html>
