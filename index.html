<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gifts & Stars Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --accent: #66fcf1;
            --accent-gold: #ffd700;
            --text-main: #ffffff;
            --text-dim: #c5c6c7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 95vh;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121820;
            padding: 12px 18px;
            border-radius: 16px;
            border: 1px solid #2a3440;
            box-sizing: border-box;
        }

        .balance-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: 18px;
            color: var(--accent-gold);
        }

        .casino-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px 16px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 12px 32px rgba(0,0,0,0.7);
            border: 1px solid #2c3a47;
            box-sizing: border-box;
            position: relative;
        }

        /* ТЕЛЕЖКА / РУЛЕТКА */
        .roulette-viewport {
            width: 100%;
            height: 130px;
            background: #0b0c10;
            border-radius: 16px;
            margin: 20px 0;
            overflow: hidden;
            position: relative;
            border: 2px solid #45a29e;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            z-index: 10;
            box-shadow: 0 0 12px var(--accent-gold);
        }

        .tape {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            will-change: transform;
            transition: transform 4s cubic-bezier(0.08, 0.9, 0.12, 1);
        }

        .item-card {
            min-width: 90px;
            height: 100px;
            margin: 0 5px;
            background: #121820;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #2c3a47;
            box-sizing: border-box;
        }

        .item-card .icon {
            font-size: 38px;
        }

        .item-card .name {
            font-size: 10px;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 600;
        }

        .spin-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #45a29e, #66fcf1);
            border: none;
            border-radius: 16px;
            color: #0b0c10;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(102, 252, 241, 0.3);
            transition: all 0.2s ease;
        }

        .spin-btn:active {
            transform: scale(0.96);
        }

        .spin-btn:disabled {
            background: #2c3a47;
            color: #666;
            box-shadow: none;
        }

        .win-display {
            height: 24px;
            margin-top: 12px;
            font-weight: 700;
            font-size: 16px;
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight: 700; color: var(--text-dim);">👤 <span id="username">Player</span></span>
        <div class="balance-box">
            <span>⭐️</span>
            <span id="balance">0</span>
        </div>
    </div>

    <div class="casino-card">
        <h2 style="margin: 0; font-size: 22px;">🎁 NFT Gift Roulette</h2>
        <p style="color: var(--text-dim); font-size: 12px; margin-top: 4px;">Испытай удачу и выбей редкий NFT-подарок</p>

        <div class="roulette-viewport">
            <div class="pointer"></div>
            <div class="tape" id="tape"></div>
        </div>

        <div class="win-display" id="win-display"></div>

        <button class="spin-btn" id="spin-btn" onclick="executeSpin()">КРУТИТЬ (50 ⭐️)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // АВТО-ДЕТЕКТ АДРЕСА БЭКЕНДА (Локалка / ngrok / Продакшн)
        const API_URL = "http://localhost:8000"; 

        const userId = tg.initDataUnsafe?.user?.id || 12345678;
        const userName = tg.initDataUnsafe?.user?.username || "Player";

        document.getElementById('username').innerText = userName;

        let currentBalance = 0;

        // Загрузка начального баланса
        async function fetchProfile() {
            try {
                const res = await fetch(`${API_URL}/api/user/${userId}`);
                const data = await res.json();
                currentBalance = data.balance;
                document.getElementById('balance').innerText = currentBalance;
            } catch (e) {
                console.error("Ошибка сети", e);
                document.getElementById('balance').innerText = "ERR";
            }
        }

        async function executeSpin() {
            const btn = document.getElementById('spin-btn');
            const winDisplay = document.getElementById('win-display');
            
            btn.disabled = true;
            winDisplay.innerText = "Вращение...";

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            try {
                const res = await fetch(`${API_URL}/api/spin`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, bet_amount: 50 })
                });

                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Ошибка вызова API");
                    btn.disabled = false;
                    winDisplay.innerText = "";
                    return;
                }

                const data = await res.json();
                renderTape(data.roulette_tape);

                // Запуск CSS-анимации рулетки
                const tape = document.getElementById('tape');
                tape.style.transition = 'none';
                tape.style.transform = 'translateX(0px)';
                
                // Форсируем Reflow
                tape.offsetHeight; 

                const itemWidth = 100; // 90px width + 10px margin
                const targetOffset = -(35 * itemWidth) + (140 - itemWidth / 2);

                tape.style.transition = 'transform 4s cubic-bezier(0.08, 0.9, 0.12, 1)';
                tape.style.transform = `translateX(${targetOffset}px)`;

                setTimeout(() => {
                    currentBalance = data.new_balance;
                    document.getElementById('balance').innerText = currentBalance;
                    winDisplay.innerText = `Выпало: ${data.winning_item.icon} ${data.winning_item.name} (+${data.winning_item.value_stars} ⭐️)`;
                    
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    btn.disabled = false;
                }, 4100);

            } catch (e) {
                console.error(e);
                alert("Ошибка подключения к серверу казино");
                btn.disabled = false;
                winDisplay.innerText = "";
            }
        }

        function renderTape(items) {
            const tape = document.getElementById('tape');
            tape.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item-card';
                div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
                tape.appendChild(div);
            });
        }

        fetchProfile();
    </script>
</body>
</html>
