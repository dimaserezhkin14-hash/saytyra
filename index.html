<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT & Gift Casino</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --panel: #161b22;
            --accent: #58a6ff;
            --gold: #f1e05a;
            --green: #238636;
            --text: #c9d1d9;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        .balance {
            color: var(--gold);
            font-weight: bold;
            font-size: 16px;
        }

        .casino-box {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        .roulette-container {
            width: 100%;
            height: 120px;
            background: #010409;
            border-radius: 12px;
            margin: 15px 0;
            overflow: hidden;
            position: relative;
            border: 2px solid #30363d;
        }

        .pointer {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: 100%;
            background: #f0883e;
            z-index: 10;
            box-shadow: 0 0 8px #f0883e;
        }

        .tape {
            display: flex;
            align-items: center;
            height: 100%;
            position: absolute;
            left: 0;
            will-change: transform;
        }

        .item {
            min-width: 80px;
            height: 90px;
            margin: 0 4px;
            background: #21262d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid #30363d;
            box-sizing: border-box;
        }

        .item .icon { font-size: 32px; }
        .item .name { font-size: 9px; color: #8b949e; margin-top: 4px; }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s;
        }

        .btn-spin { background: #238636; color: #fff; }
        .btn-dep { background: #1f6beb; color: #fff; }

        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .deposit-section {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid #30363d;
        }

        .info-text {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="username">👤 Loading...</span>
        <div class="balance">⭐️ <span id="balance">100</span></div>
    </div>

    <div class="casino-box">
        <h3 style="margin: 0;">🎁 NFT Gift Case</h3>
        <div class="info-text">Крути рулетку и выбивай ценные гифты</div>

        <div class="roulette-container">
            <div class="pointer"></div>
            <div class="tape" id="tape"></div>
        </div>

        <div id="status-text" style="height: 20px; font-weight: bold; margin-bottom: 8px; color: var(--gold);"></div>

        <button class="btn btn-spin" id="spin-btn" onclick="spin()">КРУТИТЬ (50 ⭐️)</button>

        <div class="deposit-section">
            <div class="info-text">Для пополнения отправьте подарок/NFT аккаунту <b>@GuarantRelayer</b></div>
            <button class="btn btn-dep" onclick="openDeposit()">📥 Пополнить баланс / Депозит</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('username').innerText = `👤 ${user.username || user.first_name}`;
        } else {
            document.getElementById('username').innerText = '👤 Player';
        }

        const ITEMS = [
            { name: "💩 Poop", icon: "💩", val: 10, w: 50 },
            { name: "🐸 Pepe", icon: "🐸", val: 40, w: 30 },
            { name: "🧸 Teddy", icon: "🧸", val: 100, w: 15 },
            { name: "🚀 Rocket", icon: "🚀", val: 300, w: 4 },
            { name: "💎 Diamond", icon: "💎", val: 1000, w: 1 }
        ];

        function getRandomItem() {
            let totalWeight = ITEMS.reduce((acc, item) => acc + item.w, 0);
            let random = Math.random() * totalWeight;
            for (let item of ITEMS) {
                if (random < item.w) return item;
                random -= item.w;
            }
            return ITEMS[0];
        }

        function fillTape(winningItem) {
            const tape = document.getElementById('tape');
            tape.innerHTML = '';
            
            // Генерируем 40 случайных предметов + 1 выигрышный на 32 позицию
            let list = [];
            for (let i = 0; i < 30; i++) list.push(ITEMS[Math.floor(Math.random() * ITEMS.length)]);
            list.push(winningItem);
            for (let i = 0; i < 10; i++) list.push(ITEMS[Math.floor(Math.random() * ITEMS.length)]);

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div class="icon">${item.icon}</div><div class="name">${item.name}</div>`;
                tape.appendChild(div);
            });
        }

        function spin() {
            if (balance < 50) {
                alert("Недостаточно баланса! Пополните счет.");
                return;
            }

            balance -= 50;
            document.getElementById('balance').innerText = balance;

            const btn = document.getElementById('spin-btn');
            btn.disabled = true;
            document.getElementById('status-text').innerText = "Вращение...";

            const winItem = getRandomItem();
            fillTape(winItem);

            const tape = document.getElementById('tape');
            tape.style.transition = 'none';
            tape.style.transform = 'translateX(0px)';
            tape.offsetHeight; // Reflow

            const itemWidth = 88; // 80px + 8px margin
            const targetX = -(30 * itemWidth) + (180 - itemWidth / 2);

            tape.style.transition = 'transform 3.5s cubic-bezier(0.05, 0.9, 0.1, 1)';
            tape.style.transform = `translateX(${targetX}px)`;

            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            setTimeout(() => {
                balance += winItem.val;
                document.getElementById('balance').innerText = balance;
                document.getElementById('status-text').innerText = `Выигрыш: ${winItem.icon} ${winItem.name} (+${winItem.val} ⭐️)`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                btn.disabled = false;
            }, 3600);
        }

        function openDeposit() {
            tg.openTelegramLink('https://t.me/GuarantRelayer');
        }

        // Первичная инициализация
        fillTape(ITEMS[0]);
    </script>
</body>
</html>
